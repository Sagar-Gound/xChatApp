<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <script type="module">
      (async () => {
        try {
          const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js");
          const { getDatabase, ref, push, set, onValue, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js");
          window.FirebaseSDK = { initializeApp, getDatabase, ref, push, set, onValue, serverTimestamp };
        } catch (e) {
          // Fallback when offline
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
